; PlatformIO project for the PAROL6 arm firmware.
; Docs: https://docs.platformio.org/page/projectconf.html

[env:megaatmega2560]
platform = atmelavr          ; chip family (ATmega2560 is an 8-bit AVR)
board = megaatmega2560       ; Arduino Mega 2560
framework = arduino          ; gives us Arduino.h, pinMode(), Serial, ...

; Baud rate of `pio device monitor`. It MUST match the Serial.begin() in
; src/main.cpp, otherwise the monitor shows garbage characters.
monitor_speed = 250000

; External libraries. PlatformIO downloads them into .pio/ on the first build,
; so they are NOT part of this git repository.
lib_deps =
    waspinator/AccelStepper@^1.64

; Upload port. Left commented out on purpose: PlatformIO auto-detects the
; board. Uncomment and fix the path only if auto-detection fails.
; upload_port = /dev/ttyACM0

