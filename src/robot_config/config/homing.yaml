# Homing-related values (which joints to home, how far to look, ...).
# See common.yaml for an explanation of the format.
#
# WHERE each switch is lives in hardware.yaml, as home_dir and home_offset_rad
# on every joint, because that is a fact about the arm. This file is only
# about HOW to go looking for it.
/**:
  ros__parameters:
    homing:
      # The joints to home. One at a time, in exactly this order.
      #
      # START WITH ONE JOINT. No home_dir in hardware.yaml has ever been
      # checked on the real arm, so a joint can walk the wrong way: the wrist
      # is the safest one to be wrong about, it only spins on itself.
      # Once every direction is right, write all six:
      #   ["base", "shoulder", "upperArm", "elbow", "forearm", "wrist"]
      joints: ["base", "shoulder", "upperArm", "elbow", "forearm"]

      # How far to look for the switch, IN EACH DIRECTION. Homing tries the
      # way home_dir points, and if that comes up empty it returns to where
      # the joint started and tries the other way. Only when both are empty
      # is it an error.
      #
      # This is also the only travel limit there is: whatever happens, a joint
      # never gets further than this from the position it began at. Keep it
      # small while testing a joint for the first time, then raise it to a bit
      # more than the real distance to the switch.
      search_rad: 4.0

      # One creep towards the switch, per tick. With rate_hz below this is
      # about 0.2 rad/s. It must stay WIDER THAN ONE MOTOR STEP, otherwise the
      # bridge rounds it down to zero steps and the joint never moves at all:
      # the widest step is the base's, 2*pi/(200*6.4) = 0.0049 rad.
      step_rad: 0.02

      tolerance_rad: 0.01   # close enough to call the last move finished
      rate_hz: 10.0         # how often a new target is sent

      # Where the arm parks once it is homed, in joint order:
      #   [base, shoulder, upperArm, elbow, forearm, wrist]
      #
      # All zeros means the home pose itself, so the arm does not move: that is
      # the safe default, and it is what happens until you fill these in.
      #
      #
      start_pose_rad: [-2.2, 0.3, -0.8, 0.4, -3.0, 0.0]
